# Checks only. Vercel's Git integration does the deploys: a push to main
# redeploys each connected project, and a PR gets a preview. No secrets needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [cadencepay-demo, message-in-a-cell]
    defaults:
      run:
        working-directory: experiments/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: experiments/${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build
